>安全庫存天數\u003c/label>\u003cinput id=\"safe\" type=\"number\" value=\"7\" min=\"0\">\u003c/div>\u003cdiv class=\"box\">\u003clabel>最低補貨量（有需求時）\u003c/label>\u003cinput id=\"minq\" type=\"number\" value=\"1\" min=\"1\">\u003c/div>\u003cdiv class=\"box\">\u003clabel>一起補貨門檻（天）\u003c/label>\u003cinput id=\"joinThreshold\" type=\"number\" value=\"18\" min=\"0\">\u003c/div>\u003cdiv class=\"box\">\u003clabel>一起補貨目標天數\u003c/label>\u003cinput id=\"joinTarget\" type=\"number\" value=\"21\" min=\"0\">\u003c/div>\u003c/div>\n\u003cdiv class=\"summary\">\u003cdiv class=\"stat\">\u003cspan>建議補貨總數\u003c/span>\u003cb id=\"total\">0\u003c/b>\u003c/div>\u003cdiv class=\"stat\">\u003cspan>需要補貨 SKU\u003c/span>\u003cb id=\"skus\">0\u003c/b>\u003c/div>\u003cdiv class=\"stat\">\u003cspan>高風險 SKU\u003c/span>\u003cb id=\"risk\">0\u003c/b>\u003c/div>\u003cdiv class=\"stat\">\u003cspan>目標備貨天數\u003c/span>\u003cb id=\"cover\">14 天\u003c/b>\u003c/div>\u003c/div>\n\u003cdiv class=\"note\">\u003cb>計算方式：\u003c/b>平均日銷量＝近 60 天銷量 ÷ 60；安全庫存＝平均日銷量 × 7 天；一般建議補貨＝（平均日銷量 × 到貨等待 7 天）＋安全庫存 7 天－目前庫存，無條件進位，也就是一般補到約 14 天庫存。庫存可售天數介於一般補貨線（14 天）與「一起補貨門檻」（預設 18 天）時，標示為「可一起補貨」，並補到「一起補貨目標天數」（預設 21 天）。近期銷量為 0 時預設不補貨。\u003c/div>\n\u003cdiv class=\"actions\">\u003cbutton onclick=\"resetData()\">數值歸零\u003c/button>\u003cbutton class=\"secondary\" onclick=\"printInventory()\">列印盤點單\u003c/button>\u003cbutton class=\"secondary\" onclick=\"copyList()\">複製補貨明細\u003c/button>\u003c/div>\n\u003cdiv class=\"tablebox\">\u003ctable>\u003cthead>\u003ctr>\u003cth>品號\u003c/th>\u003cth>品名\u003c/th>\u003cth>60天銷量\u003c/th>\u003cth>庫存\u003c/th>\u003cth>日均銷量\u003c/th>\u003cth>庫存可售天數\u003c/th>\u003cth>建議補貨\u003c/th>\u003cth>狀態\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"tb\">\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cdiv id=\"toast\" class=\"toast\">已複製！\u003c/div>\u003cscript>let sessionSavedData='{}';\nfunction readSavedData(){try{return localStorage.getItem('restockCalculatorData')||sessionSavedData}catch(e){return session ,0,0,0],\n[\"DRI02002\",\"水果濃縮 - 荔枝｜一箱6入\u003cbr>(最低叫貨10箱)\",0,0,0,0],\n[\"DRI02003\",\"水果濃縮 - 水蜜桃｜一箱6入\u003cbr>(最低叫貨10箱)\",0,0,0,0],\n[\"EAT00902\",\"珍珠｜一箱360入\u003cbr>(最低叫貨25箱)\",0,0,0,0],\n[\"EAT01201\",\"櫻花晶球｜一箱6入\u003cbr>(最低叫貨20箱)\",0,0,0,0]\n];\nlet current='rice';\nfunction data(){return current==='natural'?naturalRaw:current==='lekelai'?lekelaiRaw:riceRaw}\nfunction switchPage(p){current=p;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.page===p));pageTitle.textContent=p==='natural'?'自然風':p==='lekelai'?'樂客來':'米粉';draw()}\nfunction draw(){\n  let d=data();\n  const head=document.querySelector('thead tr');\n  if(current==='lekelai'){\n    head.innerHTML='\u003cth>品號\u003c/th>\u003cth>品名\u003c/th>\u003cth>香藝\u003cbr>60天銷量\u003c/th>\u003cth>蝦皮\u003cbr>60天銷量\u003c/th>\u003cth>總銷量\u003c/th>\u003cth>香藝庫存\u003c/th>\u003cth>蝦皮庫存\u003c/th>\u003cth>總庫存\u003c/th>\u003cth>日均銷量\u003c/th>\u003cth>庫存可售天數\u003c/th>\u003cth>建議補貨\u003c/th>\u003cth>狀態\u003c/th>';\n    tb.innerHTML=d.map(r=>`\u003ctr>\u003ctd>${r[0]}\u003c/td>\u003ctd>${r[1]}\u003c/td>\u003ctd>\u003cinput class=\"num sales fragrance-sales\" value=\"${r[2]}\" type=\"number\" min=\"0\">\u003c/td>\u003ctd>\u003cinput class=\"num sales shopee-sales\" value=\"${r[3]}\" type=\"number\" min=\"0\">\u003c/td>\u003ctd class=\"total-sales\">0\u003c/td>\u003ctd>\u003cinput class=\"num stock fragrance-stock\" value=\"${r[4]}\" type=\"number\" min=\"0\">\u003c/td>\u003ctd>\u003cinput class=\"num stock shopee-stock\" value=\"${r[5]}\" type=\"number\" min=\"0\">\u003c/td>\u003ctd class=\"total-stock\">0\u003c/td>\u003ctd class=\"daily\">\u003c/td>\u003ctd class=\"days\">\u003c/td>\u003ctd class=\"qty\">\u003c/td>\u003ctd class=\"status\">\u003c/td>\u003c/tr>`).join('');\n  }else{\n    head.innerHTML='\u003cth>品號\u003c/th>\u003cth>品名\u003c/th>\u003cth>60天銷量\u003c/th>\u003cth>庫存\u003c/th>\u003cth>日均銷量\u003c/th>\u003cth>庫存可售天數\u003c/th>\u003cth>建議補貨\u003c/th>\u003cth>狀態\u003c/th>';\n    tb.innerHTML=d.map((r,i)=>r[0]==='__section__'?`\u003ctr class=\"section-row\">\u003ctd colspan=\"8\">${r[1]}\u003c/td>\u003c/tr>`:`\u003ctr>\u003ctd>${r[0]}\u003c/td>\u003ctd>${r[1]}\u003c/td>\u003ctd>\u003cinput class=\"num sales\" value=\"${r[2]}\" type=\"number\" min=\"0\">\u003c/td>\u003ctd>\u003cinput class=\"num stock\" value=\"${r[3]}\" type=\"number\" min=\"0\">\u003c/td>\u003ctd class=\"daily\">\u003c/td>\u003ctd class=\"days\">\u003c/td>\u003ctd class=\"qty\">\u003c/td>\u003ctd class=\"status\">\u003c/td>\u003c/tr>`).join('');\n  }\n  document.querySelectorAll('.controls input').forEach(x=>x.addEventListener('input',calc));\n  loadData();\n  document.querySelectorAll('.sales,.stock').forEach(x=>x.addEventListener('input',()=>{calc();saveData()}));\n  const inputs=[...document.querySelectorAll('.sales,.stock')];\n  inputs.forEach((x,i)=>x.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(i\u003cinputs.length-1){inputs[i+1].focus();inputs[i+1].select()}}}));\n  calc()\n}\nfunction calc(){\nlet p=+period.value||60,l=+lead.value||0,s=+safe.value||0,m=+minq.value||1,target=l+s,\njt=+joinThreshold.value||0,jgoal=+joinTarget.value||target,T=0,S=0,R=0;\ncover.textContent=target+' 天';\n[...tb.rows].forEach(tr=>{\nif(tr.classList.contains('section-row'))return;\nlet sale,st;\nif(current==='lekelai'){\n  sale=(+tr.querySelector('.fragrance-sales').value||0)+(+tr.querySelector('.shopee-sales').value||0);\n  st=(+tr.querySelector('.fragrance-stock').value||0)+(+tr.querySelector('.shopee-stock').value||0);\n  tr.querySelector('.total-sales').textContent=sale;\n  tr.querySelector('.total-stock').textContent=st;\n}else{\n  sale=+tr.querySelector('.sales').value||0;\n  st=+tr.querySelector('.stock').value||0;\n}\nlet d=sale/p;\nlet days=d?st/d:Infinity;\nlet normalQ=sale===0?0:Math.max(0,Math.ceil(d*target-st));\nlet q=normalQ;\nlet label,cls;\nif(sale===0){label='近期無銷量';cls='dead';q=0}\nelse if(days\u003cl){label='高風險';cls='high';R++}\nelse if(days\u003ctarget){label='建議補貨';cls='watch'}\nelse if(days\u003c=jt){label='可一起補貨';cls='join';q=Math.max(0,Math.ceil(d*jgoal-st))}\nelse{label='庫存足夠';cls='enough';q=0}\nif(q>0)q=Math.max(q,m);\ntr.querySelector('.daily').textContent=d.toFixed(2);\ntr.querySelector('.days').textContent=isFinite(days)?Math.round(days)+' 天':'—';\ntr.querySelector('.qty').innerHTML=q?`\u003cspan class=\"need\">${q}\u003c/span>`:`\u003cspan class=\"zero\">0\u003c/span>`;\ntr.querySelector('.status').innerHTML=`\u003cspan class=\"tag ${cls}\">${label}\u003c/span>`;\nT+=q;if(q)S++\n});\ntotal.textContent=T;skus.textContent=S;risk.textContent=R\n}\n\nfunction printInventory(){\n  const rows=data();\n  const title=pageTitle.textContent+'｜盤點單';\n  const esc=v=>String(v).replace(/[&\u003c>\\\"]/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\n  let n=0;const body=rows.map(r=>r[0]==='__section__'?`\u003ctr>\u003ctd colspan=\"4\" style=\"font-weight:800;background:#f3f3f3;text-align:left\">${esc(r[1])}\u003c/td>\u003c/tr>`:`\u003ctr>\u003ctd>${++n}\u003c/td>\u003ctd>${esc(r[0])}\u003c/td>\u003ctd class=\"name\">${esc(r[1])}\u003c/td>\u003ctd class=\"count\">\u003c/td>\u003c/tr>`).join('');\n  const w=window.open('','_blank');\n  if(!w){alert('瀏覽器阻擋了列印視窗，請允許此網頁開啟彈出式視窗後再試一次。');return;}\n  w.document.write(`\u003c!doctype html>\u003chtml lang=\"zh-Hant\">\u003chead>\u003cmeta charset=\"utf-8\">\u003ctitle>${esc(title)}\u003c/title>\u003cstyle>\n    @page{size:A4;margin:12mm}*{box-sizing:border-box}body{font-family:system-ui,-apple-system,\"Segoe UI\",\"Noto Sans TC\",sans-serif;color:#222;margin:0}h1{font-size:22px;margin:0 0 6px;text-align:center}.meta{font-size:12px;margin:0 0 12px;text-align:right;color:#555}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{border:1px solid #555;padding:8px 7px;font-size:12px;height:36px}th{background:#f3f3f3;text-align:center}th:nth-child(1),td:nth-child(1){width:8%;text-align:center}th:nth-child(2),td:nth-child(2){width:22%;text-align:center}th:nth-child(3),td:nth-child(3){width:50%}.name{text-align:left}th:nth-child(4),td:nth-child(4){width:20%}.count{height:38px}thead{display:table-header-group}tr{page-break-inside:avoid}@media print{.no-print{display:none}}\n  \u003c/style>\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\u003clink href=\"https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@200..900&display=swap\" rel=\"stylesheet\">\u003cstyle id=\"site-font\">html,body,body *{font-family:\"Chiron GoRound TC\",sans-serif;font-optical-sizing:auto;font-style:normal}body{font-weight:300}button,input,textarea,select{font-family:\"Chiron GoRound TC\",sans-serif;font-optical-sizing:auto;font-style:normal}input,textarea,select{font-weight:300}\u003c/style>\u003c/head>\u003cbody>\u003ch1>${esc(title)}\u003c/h1>\u003cdiv class=\"meta\">列印日期：${new Date().toLocaleDateString('zh-TW')}\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>序號\u003c/th>\u003cth>品號\u003c/th>\u003cth>品名\u003c/th>\u003cth>盤點數量\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${body}\u003c/tbody>\u003c/table>\u003cscript>window.onload=()=>{setTimeout(()=>window.print(),150)}\u003c\\/script>\u003c/body>\u003c/html>`);\n  w.document.close();\n}\n\nfunction copyList(){calc();let a=[];[...tb.rows].forEach(tr=>{if(tr.classList.contains('section-row'))return;let q=+tr.querySelector('.qty').innerText||0;if(q)a.push(`${tr.cells[1].innerText} × ${q}包`)});copyText(a.length?`【${pageTitle.textContent}補貨建議】\\n`+a.join('\\n'):'目前無需補貨').then(()=>showToast()).catch(()=>{})}\nfunction showToast(){toast.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>toast.classList.remove('show'),1500)}\nfunction saveData(){\n  const saved=JSON.parse(readSavedData()||'{}');\n  saved[current]=[...tb.rows].filter(tr=>!tr.classList.contains('section-row')).map(tr=>{\n    const base={code:tr.cells[0].innerText};\n    if(current==='lekelai'){\n      return {...base,\n        fragranceSales:+tr.querySelector('.fragrance-sales').value||0,\n        shopeeSales:+tr.querySelector('.shopee-sales').value||0,\n        fragranceStock:+tr.querySelector('.fragrance-stock').value||0,\n        shopeeStock:+tr.querySelector('.shopee-stock').value||0\n      };\n    }\n    return {...base,sales:+tr.querySelector('.sales').value||0,stock:+tr.querySelector('.stock').value||0};\n  });\n  writeSavedData(JSON.stringify(saved));\n}\nfunction loadData(){\n  const saved=JSON.parse(readSavedData()||'{}');\n  const rows=saved[current];\n  if(!rows)return;\n  [...tb.rows].filter(tr=>!tr.classList.contains('section-row')).forEach((tr,i)=>{\n    const code=tr.cells[0].innerText;\n    const row=rows.find?.(x=>x.code===code)||rows[i];\n    if(!row)return;\n    if(current==='lekelai'){\n      tr.querySelector('.fragrance-sales').value=row.fragranceSales??0;\n      tr.querySelector('.shopee-sales').value=row.shopeeSales??0;\n      tr.querySelector('.fragrance-stock').value=row.fragranceStock??0;\n      tr.querySelector('.shopee-stock').value=row.shopeeStock??0;\n    }else{\n      tr.querySelector('.sales').value=row.sales??0;\n      tr.querySelector('.stock').value=row.stock??0;\n    }\n  });\n}\nfunction resetData(){\n  [...tb.rows].forEach(tr=>{\n    if(tr.classList.contains('section-row'))return;\n    tr.querySelectorAll('.sales,.stock').forEach(x=>x.value=0);\n  });\n  saveData();\n  calc();\n}\n\ndraw();\n\u003c/script>\u003c/body>\u003c/html>\n", "shopee1688": "\u003c!doctype html>\u003chtml lang=\"zh-Hant\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>蝦皮(1688)-補貨建議計算器\u003c/title>\u003cstyle>\n:root{--bg:#f3f8fd;--card:#fff;--ink:#243b53;--muted:#637d96;--accent:#3b82c4;--soft:#e7f2fc;--line:#d5e3f0;--danger:#175a9b;--ok:#538bb7}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#edf5fd,#fbfdff);font-family:system-ui static.com\" crossorigin>\u003clink href=\"https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@200..900&display=swap\" rel=\"stylesheet\">\u003cstyle id=\"site-font\">html,body,body *{font-family:\"Chiron GoRound TC\",sans-serif;font-optical-sizing:auto;font-style:normal}body{font-weight:300}button,input,textarea,select{font-family:\"Chiron GoRound TC\",sans-serif;font-optical-sizing:auto;font-style:normal}input,textarea,select{font-weight:300}\u003c/style>\u003c/head>\u003cbody>\u003cdiv class=\"wrap\">\u003ch1>📦 蝦皮(1688)-補貨建議計算器\u003c/h1>\u003cdiv class=\"sub\">依近期銷速、現有庫存與到貨等待期，自動估算建議補貨數量。\u003c/div>\n\u003cdiv class=\"tabs\">\u003cbutton class=\"tab active\" data-page=\"bowl\" onclick=\"switchPage('bowl')\">🐾 寵物高腳碗\u003c/button>\u003cbutton class=\"tab\" data-page=\"bottle\" onclick=\"switchPage('bottle')\">🥤 胖胖水壺\u003c/button>\u003cbutton class=\"tab\" data-page=\"marker\" onclick=\"switchPage('marker')\">🖍️ 丙烯馬克筆\u003c/button>\u003cbutton class=\"tab\" data-page=\"oat\" onclick=\"switchPage('oat')\">🥣 燕麥杯\u003c/button>\u003cbutton class=\"tab\" data-page=\"backpack\" onclick=\"switchPage('backpack')\">🎒 兒童小背包\u003c/button>\u003cbutton class=\"tab\" data-page=\"wire\" onclick=\"switchPage('wire')\">🔌 電線保護套\u003c/button>\u003cbutton class=\"tab\" data-page=\"velcro\" onclick=\"switchPage('velcro')\">🧷 魔鬼氈束帶\u003c/button>\u003c/div>\n\u003ch2 class=\"page-title\" id=\"pageTitle\">寵物高腳碗\u003c/h2>\n\u003cdiv class=\"controls\">\u003cdiv class=\"box\">\u003clabel>銷量統計天數\u003c/label>\u003cinput id=\"period\" type=\"number\" value=\"45\" min=\"1\">\u003c/div>\u003cdiv class=\"box\">\u003clabel>到貨等待天數（保守抓最慢）\u003c/label>\u003cinput id=\"lead\" type=\"number\" value=\"21\" min=\"0\">\u003c/div>\u003cdiv class=\"box\">\u003clabel>安全庫存天數\u003c/label>\u003cinput id=\"safe\" type=\"number\" value=\"14\" min=\"0\">\u003c/div>\u003cdiv class=\"box\">\u003clabel>最低補貨量（有需求時）\u003c/label>\u003cinput id=\"minq\" type=\"number\" value=\"1\" min=\"1\">\u003c/div>\u003cdiv class=\"box\">\u003clabel>一起補貨門檻（天）\u003c/label>\u003cinput id=\"joinThreshold\" type=\"number\" value=\"40\" min=\"0\">\u003c/div>\u003cdiv class=\"box\">\u003clabel>一起補貨目標天數\u003c/label>\u003cinput id=\"joinTarget\" type=\"number\" value=\"49\" min=\"0\">\u003c/div>\u003c/div>\n\u003cdiv class=\"summary\">\u003cdiv class=\"stat\">\u003cspan>建議補貨總數\u003c/span>\u003cb id=\"total\">0\u003c/b>\u003c/div>\u003cdiv class=\"stat\">\u003cspan>需要補貨 SKU\u003c/span>\u003cb id=\"skus\">0\u003c/b>\u003c/div>\u003cdiv class=\"stat\">\u003cspan>高風險 SKU\u003c/span>\u003cb id=\"risk\">0\u003c/b>\u003c/div>\u003cdiv class=\"stat\">\u003cspan>目標備貨天數\u003c/span>\u003cb id=\"cover\">35 天\u003c/b>\u003c/div>\u003c/div>\n\u003cdiv class=\"note\">\u003cb>計算方式：\u003c/b>平均日銷量＝近 1.5 個月銷量 ÷ 45；安全庫存＝平均日銷量 × 14 天；一般建議補貨＝（平均日銷量 × 到貨天數）＋安全庫存－目前庫存，無條件進位。庫存可售天數介於一般補貨線（目前 35 天）與「一起補貨門檻」（預設 40 天）時，標示為「可一起補貨」，並補到「一起補貨目標天數」（預設 49 天）。近期銷量為 0 時預設不補貨。\u003c/div>\n\u003cdiv class=\"actions\">\u003cbutton onclick=\"resetData()\">數值歸零\u003c/button>\u003cbutton class=\"secondary\" onclick=\"printInventory()\">列印盤點單\u003c/button>\u003cbutton class=\"secondary\" onclick=\"copyList()\">複製補貨明細\u003c/button>\u003c/div>\n\u003cdiv class=\"tablebox\">\u003ctable>\u003cthead>\u003ctr>\u003cth>品號\u003c/th>\u003cth>品名\u003c/th>\u003cth>1.5個月銷量\u003c/th>\u003cth>庫存\u003c/th>\u003cth>日均銷量\u003c/th>\u003cth>庫存可售天數\u003c/th>\u003cth>建議補貨\u003c/th>\u003cth>狀態\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"tb\">\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cdiv id=\"toast\" class=\"toast\">已複製！\u003c/div>\u003cscript>let sessionSavedData='{}';\nfunction readSavedData(){try{return localStorage.getItem('restockCalculatorData')||sessionSavedData}catch(e){return sessionSavedData}}\nfunction writeSavedData(value){sessionSavedData=value;try{localStorage.setItem('restockCalculatorData',value)}catch(e){}}\nfunction copyText(value){\n if(navigator.clipboard && navigator.clipboard.writeText){return navigator.clipboard.wr
